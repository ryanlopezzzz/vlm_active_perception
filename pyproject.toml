[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-optical-alignment"
version = "0.1.0"
description = "Vision-language agents for optical alignment and active laboratory perception"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "bayesian-optimization>=3.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "scipy>=1.11",
]

[project.optional-dependencies]
hardware = [
  "opencv-python>=4.10",
  "xarm-python-sdk>=1.14",
  "pyrealsense2>=2.55; platform_system != 'Darwin'",
]
notebooks = [
  "ipykernel>=6",
  "jupyterlab>=4",
]

[project.scripts]
optics-alignment = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.setuptools.package-data]
src = ["prompts/*.txt", "sim/assets/*.json", "sim/assets/*.npz"]
